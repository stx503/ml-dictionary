<!doctype html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e4a47">
  <title>English–Malayalam Dictionary</title>
  <script>
    /* Apply the saved theme before the page paints (avoids a white flash in AMOLED mode). */
    try {
      var t = localStorage.getItem("theme");
      if (t === "auto" || t === "light" || t === "dark" || t === "amoled") document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="top-row">
      <h1>English <span>→</span> മലയാളം</h1>
      <button id="theme" type="button" aria-label="Change theme">◐ Auto</button>
    </div>
    <p>Dictionary with synonyms &amp; examples</p>
  </header>

  <main>
    <form id="search-form" autocomplete="off">
      <input id="q" type="search" placeholder="Type an English word…"
             enterkeyhint="search" autocapitalize="none" autocorrect="off"
             spellcheck="false" aria-label="English word">
      <button type="submit">Search</button>
    </form>
    <ul id="suggestions" hidden></ul>

    <nav id="tabs" role="tablist">
      <button id="tab-search" type="button" role="tab" aria-selected="true" class="active">Search</button>
      <button id="tab-saved" type="button" role="tab" aria-selected="false">★ Saved (0)</button>
    </nav>

    <section id="result" aria-live="polite"></section>
    <section id="recent" class="list-section"></section>
    <section id="saved" class="list-section"></section>
  </main>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="defs.js"></script>
  <script src="app.js"></script>
</body>
</html>
